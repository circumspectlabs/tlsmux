# directive: gotemplate

include modules.conf;

{{- with .global.snippet }}
{{ include (printf "%s%s" "{{ \"\" -}}\n" . ) $ }}
{{- end }}

http {
  include mime.types;

  ###
  ### Http router
  ###
  include http.conf;

  ###
  ### Http configurations
  ###
  include http.d/*.conf;
}

stream {
  ###
  ### Premux is a TLS pre-read multiplexer. It can route incoming TLS
  ### and non-TLS connections (recognizes!) to different upstreams based
  ### on SNI and ALPN in TLS ClientHello. It does not terminate TLS allowing
  ### to use client certificates and remain end-to-end encryption.
  ###
  include premux.conf;

  ###
  ### Stream configurations
  ###
  include stream.d/*.conf;
}
