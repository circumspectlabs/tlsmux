# directive: gotemplate

{{- define "escaped_sni_or_regex" -}}
{{- if .regex -}}
{{- .sni -}}
{{- else -}}
{{ .sni | default "" | replace "." "[.]" }}
{{- end -}}
{{- end -}}

{{- define "upstream_name" -}}
premux_
{{- with .alpn -}}alpn_{{- regexReplaceAll "[^a-zA-Z0-9]" (. | join "_") "_" -}}{{- end -}}
{{- if and (.sni) (.alpn) -}}_{{- end -}}
{{- with .sni -}}sni_{{- regexReplaceAll "[^a-zA-Z0-9]" . "_" -}}{{- end -}}
{{- end -}}

{{- define "premux_listen_port" -}}
{{- if or (kindIs "int" .) (kindIs "float64" .) -}}
{{ printf "[::]:%d ipv6only=off" . }}
{{- else -}}
{{ . }}
{{- end -}}
{{- end -}}

{{ if .premux.enabled -}}
{{- with .premux.snippet }}
{{ include (printf "%s%s" "{{ \"\" -}}\n" . ) $ }}
{{- end }}

map $ssl_preread_protocol $premux_protocol {
  ""        notls;
  default   tls;
}

map "$premux_protocol:$ssl_preread_alpn_protocols:$ssl_preread_server_name" $premux_proxy_protocol {
  {{- if .premux.no_tls.enabled }}
  "notls::" {{ .premux.no_tls.proxy_protocol | default false | ternary "on" "off" }};
  {{- end }}

  {{ range $route := .premux.routes -}}
  {{ if $route.alpn -}}
  {{ range $alpn := $route.alpn -}}
  '~tls:[^:]*{{ $alpn | replace "." "[.]" }}[^:]*:{{ template "escaped_sni_or_regex" $route }}' {{ $route.proxy_protocol | default false  | ternary "on" "off" }};
  {{ end }}
  {{- else -}}
  '~tls:[^:]*:{{ template "escaped_sni_or_regex" $route }}' {{ $route.proxy_protocol | default false | ternary "on" "off" }};
  {{ end }}
  {{- end }}

  {{- if .premux.default.enabled -}}
  default {{ .premux.default.proxy_protocol | default false | ternary "on" "off" }};
  {{- end }}
}

map "$premux_protocol:$ssl_preread_alpn_protocols:$ssl_preread_server_name" $premux_upstream {
  {{- if .premux.no_tls.enabled }}
  "notls::" premux_notls;
  {{- end }}

  {{ range $route := .premux.routes -}}
  {{ if $route.alpn -}}
  {{ range $alpn := $route.alpn -}}
  '~tls:[^:]*{{ $alpn | replace "." "[.]" }}[^:]*:{{ template "escaped_sni_or_regex" $route }}' {{ template "upstream_name" $route }};
  {{ end }}
  {{- else -}}
  '~tls:[^:]*:{{ template "escaped_sni_or_regex" $route }}' {{ template "upstream_name" $route }};
  {{ end }}
  {{- end }}

  {{- if .premux.default.enabled -}}
  default premux_default;
  {{- end }}
}

map "$premux_protocol:$ssl_preread_alpn_protocols:$ssl_preread_server_name" $premux_whitelist {
  {{- if and .premux.no_tls.enabled (not (empty .premux.no_tls.whitelist)) }}
  'notls::' "{{ join " " .premux.no_tls.whitelist }}";
  {{- end }}

  {{ range $route := .premux.routes -}}
  {{ if $route.alpn -}}
  {{ range $alpn := $route.alpn -}}
  '~tls:[^:]*{{ $alpn | replace "." "[.]" }}[^:]*:{{ template "escaped_sni_or_regex" $route }}' "{{ join " " (default (list) $route.whitelist) }}";
  {{ end }}
  {{- else -}}
  '~tls:[^:]*:{{ template "escaped_sni_or_regex" $route }}' "{{ join " " (default (list) $route.whitelist) }}";
  {{ end }}
  {{- end }}

  {{- if and .premux.default.enabled (not (empty .premux.default.whitelist)) -}}
  default "{{ join " " .premux.default.whitelist }}";
  {{- end }}
}

map "$premux_proxy_protocol:$premux_upstream" $premux_upstream_pre {
  "on:$premux_upstream" $premux_upstream;
  "off:$premux_upstream" premux_deproxy;
}

{{ if .premux.no_tls.enabled }}
upstream premux_notls {
  {{ range .premux.no_tls.target -}}
  server "{{ . }}";
  {{- end }}
}

{{ end -}}

{{ if .premux.default.enabled }}
upstream premux_default {
  {{ range .premux.default.target -}}
  server "{{ . }}";
  {{- end }}
}

{{ end -}}

upstream premux_deproxy {
  server 127.0.0.1:65444;
}

{{ range $upstream := .premux.routes -}}
upstream {{ template "upstream_name" $upstream }} {
  {{ range .target -}}
  server "{{ . }}";
  {{- end }}
}

{{ end -}}

server {
  listen          {{ template "premux_listen_port" .premux.listen }} {{ .premux.multipath | ternary "multipath" "" }} {{ .premux.proxy_protocol | ternary "proxy_protocol" "" }};
  proxy_pass      $premux_upstream_pre;
  proxy_protocol  on;
  ssl_preread     on;

  {{ with .premux.real_ip_from -}}
  {{ range . -}}
  set_real_ip_from {{ . }};
  {{ end -}}
  {{ end }}

  preread_by_lua_block {
    local ipmatcher = require("resty.ipmatcher")

    -- get whitelist from map
    local whitelist = ngx.var.premux_whitelist or ""
    whitelist = whitelist:gsub("^%s+", ""):gsub("%s+$", "")

    -- no whitelist means bypass
    if whitelist == "" then
      return
    end

    -- expand bare IPs into CIDR
    local expanded = {}

    for token in whitelist:gmatch("%S+") do
      -- already CIDR?
      if token:find("/") then
        table.insert(expanded, token)
      else
        -- detect IPv6 vs IPv4
        if token:find(":") then
          table.insert(expanded, token .. "/128")
        else
          table.insert(expanded, token .. "/32")
        end
      end
    end

    -- build matcher
    local matcher, err = ipmatcher.new(expanded)
    if not matcher then
      ngx.log(ngx.ERR, "invalid whitelist: ", err)
      return ngx.exit(ngx.ERROR)
    end

    -- get client IP (proxy protocol preferred)
    local ip = ngx.var.proxy_protocol_addr
    if not ip or ip == "" then
      ip = ngx.var.remote_addr
    end

    -- normalize IPv4-mapped IPv6
    if ip and ip:sub(1, 7) == "::ffff:" then
      ip = ip:sub(8)
    end

    -- match
    if not matcher:match(ip) then
      ngx.log(ngx.WARN, "IP blocked: ", ip)
      return ngx.exit(ngx.ERROR)
    end
  }
}

server {
  listen          127.0.0.1:65444 proxy_protocol;
  proxy_pass      $premux_upstream;
  proxy_protocol  off;
  ssl_preread     on;
}
{{ end -}}
